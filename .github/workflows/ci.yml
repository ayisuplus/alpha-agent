name: Native checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci --no-audit --no-fund
      - run: bun run check
      - run: bun run test
      - run: bun run validate:skills
      - run: bun run build:desktop-ui
